<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Storyboard Multimodal</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="icon" type="image/png" href="icon.png">
<link href="https://fonts.cdnfonts.com/css/open-dyslexic" rel="stylesheet">

<style>
body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  font-family: 'Open-Dyslexic', sans-serif;
	font-style: normal;
	font-weight: normal;
}
button,
input,
textarea,
label {
  font-family: inherit;
}

#container {
  height: 100%;
  overflow-y: auto;
}
#rows {
  position: relative;
}
#rows::before {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  left: 50%;
  width: 2px;
  background: #ddd;
  transform: translateX(-50%);
}
.row {
  display: grid;
  grid-template-columns: 50% 50%;
  padding: 5px 10px;
}
.text {
  text-align: justify;
  padding-right: 5px;
}

#upload {
  position: sticky;
  top: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px;
  background: white;
  border-bottom: 1px solid #ddd;
}

#highlightBtn {
  border: none;
  border-radius: 8px;
  padding: 8px 14px;
  background: #111;
  color: white;
  cursor: pointer;
  transition: 0.15s;
}
#highlightBtn:disabled {
  opacity: 0.3;
  cursor: default;
}
#highlightBtn:hover:not(:disabled) {
  transform: scale(1.03);
}

.highlight {
  background:
    linear-gradient(
      transparent 35%,
      rgba(0, 130, 255, 0.6) 35%
    );
  border-radius: 2px;
  padding: 0 1px;
}

.comment {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 20px;
}

.proposal-bubble {
  position: relative;
  background: #f1f0f0;
  border-radius: 16px 16px 16px 0;
  box-shadow: 5px 5px 5px rgba(0, 0, 0, 0.9);
  margin-left: 12px;
  padding: 0;
  overflow: hidden;
}
.proposal-bubble::after {
  content: "";
  position: absolute;
  left: -10px;
  top: 20px;
  width: 0;
  height: 0;
  border-top: 10px solid transparent;
  border-bottom: 10px solid transparent;
  border-right: 10px solid white;
}
.justification-bubble {
  position: relative;
  background: #0082ff;
  border-radius: 16px 16px 0 16px;
  box-shadow: 5px 5px 5px rgba(0, 0, 0, 0.9);
  padding: 12px 12px 0 12px;
  margin-left: 40px;
}

.comment-toolbar {
  position: relative;
  z-index: 5;
  opacity: 0;
  transition: opacity 0.2s;
}

.comment:hover .comment-toolbar,
.comment:focus-within .comment-toolbar {
  opacity: 1;
}

.comment-toolbar button,
.comment-toolbar label {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 18px;
}

.comment textarea {
  width: 100%;
  border: none;
  resize: none;
  overflow: hidden;
  padding: 10px;
  box-sizing: border-box;
  font-family: inherit;
  font-size: 14px;
  background: transparent;
}

.proposal-textarea,
.proposal-textarea::placeholder {
  min-height: 38px;
  color: black;
}
.justification-textarea,
.justification-textarea::placeholder {
  min-height: 38px;
  color: white;
}

textarea:focus,
button:focus,
label:focus,
input:focus {
  outline: none;
  box-shadow: none;
}

.dimmed-comment {
  opacity: 0.45;
  filter: blur(0.2px);
  transition:
    opacity 0.2s ease,
    transform 0.2s ease;
}

.focus-active {
  opacity: 1 !important;
  transform: scale(1.01);
  z-index: 2;
}
.linked-hover {
  background:
    linear-gradient(
      transparent 35%,
      rgba(0, 130, 255, 0.9) 35%
    );
  transition: 0.15s;
}

.comment img {
  display: block;
  width: 100%;
  max-height: 120px;
  object-fit: cover;
  cursor: zoom-in;
  transition:
    max-height 0.25s ease,
    transform 0.25s ease;
}
.comment img:hover {
  transform: scale(1.02);
  max-height: 600px;
  z-index: 5;
}

.comment audio {
  width: 100%;
  display: block;
}

.hidden-input {
  display: none;
}
</style>
</head>

<body>

<div id="container">
  <div id="upload">
    <input type="file" id="fileInput" accept=".md">
    <button id="highlightBtn" disabled>🖍️ Surligner</button>
  </div>

  <div id="rows"></div>
</div>

<script>
  document.addEventListener("dragover", e => e.preventDefault());
  const highlightBtn =
  document.getElementById("highlightBtn");

  document.addEventListener("drop", e => {
    e.preventDefault();
    const file = e.dataTransfer.files[0];
    if (!file) return;
    loadMD(file);
  });
  document.getElementById("fileInput")
    .addEventListener("change", e => {

      const file = e.target.files[0];

      if (!file) return;

      loadMD(file);
  });

  function loadMD(file) {

    if (!(file instanceof File)) {

      console.error("Invalid file:", file);

      return;
    }

    const reader = new FileReader();

    reader.onload = e => {

      const md = e.target.result;

      renderMD(md);
    };
    reader.readAsText(file);
  }

  marked.setOptions({
    breaks: true
  });
  function renderMD(md) {
    const rowsContainer = document.getElementById("rows");
    rowsContainer.innerHTML = "";
    const lines = md.split("\n");
    lines.forEach((line, i) => {

      const row = document.createElement("div");
      row.className = "row";

      const text = document.createElement("div");
      text.className = "text";

      text.innerHTML = marked.parseInline(line || " ");

      const commentSlot = document.createElement("div");
      commentSlot.className = "comment-slot";

      row.appendChild(text);
      row.appendChild(commentSlot);

      rowsContainer.appendChild(row);
    });
  }
  function activateFocus(currentDiv) {

    document
      .querySelectorAll(".comment")
      .forEach(comment => {

        if (comment !== currentDiv) {

          comment.classList.add("dimmed-comment");
        }

        else {

          comment.classList.add("focus-active");
        }
      });
  }
  function deactivateFocus() {

    document
      .querySelectorAll(".comment")
      .forEach(comment => {

        comment.classList.remove(
          "dimmed-comment",
          "focus-active"
        );
      });
  }
  function createComment(el) {

    const div = document.createElement("div");
    div.className = "comment";

    const proposalBubble = document.createElement("div");
    proposalBubble.className = "proposal-bubble";

    const toolbar = document.createElement("div");
    toolbar.className = "comment-toolbar";

    const uploadLabel = document.createElement("label");
    uploadLabel.textContent = "📂";

    const fileInput = document.createElement("input");
    fileInput.type = "file";
    fileInput.accept = "image/*,audio/*";
    fileInput.className = "hidden-input";

    uploadLabel.appendChild(fileInput);

    const deleteBtn = document.createElement("button");
    deleteBtn.textContent = "🗑️";

    toolbar.appendChild(uploadLabel);
    toolbar.appendChild(deleteBtn);

    const proposalTextarea = document.createElement("textarea");
    proposalTextarea.className = "proposal-textarea";
    proposalTextarea.placeholder = "Intention de mise en scène...";

    let hasText = false;
    let hasMedia = false;

    function processMedia(file) {

      if (hasText || hasMedia) return;

      const reader = new FileReader();

      reader.onload = () => {

        let mediaElement;

        if (file.type.startsWith("image")) {

          mediaElement = document.createElement("img");
          mediaElement.src = reader.result;
        }

        else if (file.type.startsWith("audio")) {

          mediaElement = document.createElement("audio");
          mediaElement.src = reader.result;
          mediaElement.controls = true;
        }

        if (!mediaElement) return;

        proposalBubble.appendChild(mediaElement);

        hasMedia = true;

        uploadLabel.textContent = "📁";
        uploadLabel.appendChild(fileInput);

        proposalTextarea.remove();
      };

      reader.readAsDataURL(file);
    }

    proposalTextarea.addEventListener("input", () => {

      const hasContent =
        proposalTextarea.value.trim().length > 0;

      if (hasContent && !hasMedia) {

        hasText = true;
        uploadLabel.style.visibility = "hidden";
      }

      else if (!hasMedia) {

        hasText = false;
        uploadLabel.style.visibility = "visible";
      }
    });

    fileInput.onchange = e => {

      const file = e.target.files[0];
      if (!file) return;

      processMedia(file);
    };

    proposalTextarea.addEventListener("paste", e => {

      const items = e.clipboardData.items;

      for (let item of items) {

        if (
          item.type.startsWith("image") ||
          item.type.startsWith("audio")
        ) {

          const file = item.getAsFile();

          processMedia(file);

          e.preventDefault();
          return;
        }
      }
    });

    deleteBtn.onclick = () => {

      unwrapHighlight(el);

      div.remove();

    };
    const justificationBubble = document.createElement("div");
    justificationBubble.className =
      "justification-bubble";

    const justificationTextarea =
      document.createElement("textarea");

    justificationTextarea.className =
      "justification-textarea";

    justificationTextarea.placeholder =
      "Justification interprétative...";

    justificationBubble.appendChild(
      justificationTextarea
    );

    proposalTextarea.addEventListener("input", () => {
      autoResizeTextarea(proposalTextarea);
    });

    justificationTextarea.addEventListener("input", () => {
      autoResizeTextarea(justificationTextarea);
    });

    proposalTextarea.rows = 1;
    justificationTextarea.rows = 1;

    autoResizeTextarea(proposalTextarea);
    autoResizeTextarea(justificationTextarea);

    function activate() {
      el.classList.add("linked-hover");
      div.classList.add("focus-active");
      activateFocus(div);
    }

    function deactivate() {
      el.classList.remove("linked-hover");
      div.classList.remove("focus-active");
      deactivateFocus();
    }

    el.addEventListener("mouseenter", activate);
    el.addEventListener("mouseleave", deactivate);

    div.addEventListener("mouseenter", activate);
    div.addEventListener("mouseleave", deactivate);

    proposalTextarea.addEventListener("focus", activate);
    proposalTextarea.addEventListener("blur", deactivate);

    justificationTextarea.addEventListener(
      "focus",
      activate
    );

    justificationTextarea.addEventListener(
      "blur",
      deactivate
    );

    proposalBubble.appendChild(toolbar);
    proposalBubble.appendChild(proposalTextarea);

    proposalTextarea.spellcheck = false;
    justificationTextarea.spellcheck = false;

    div.appendChild(proposalBubble);
    div.appendChild(justificationBubble);

    proposalTextarea.rows = 1;
    justificationTextarea.rows = 1;

    const row = el.closest(".row");
    const slot = row.querySelector(".comment-slot");

    slot.appendChild(div);

    return div;
  }

  function unwrapHighlight(el) {
    const parent = el.parentNode;

    while (el.firstChild) {
      parent.insertBefore(el.firstChild, el);
    }

    parent.removeChild(el);
  }

  function autoResizeTextarea(textarea) {

    textarea.style.height = "auto";

    textarea.style.height =
      textarea.scrollHeight + "px";
  }

  let currentSelectionRange = null;

  document.addEventListener("mouseup", () => {

    const sel = window.getSelection();

    if (
      sel.isCollapsed ||
      !sel.toString().trim()
    ) {

      currentSelectionRange = null;

      highlightBtn.disabled = true;

      return;
    }

    const range = sel.getRangeAt(0);

    const row =
      range.commonAncestorContainer
        .parentElement
        ?.closest(".row");

    if (!row) {

      currentSelectionRange = null;

      highlightBtn.disabled = true;

      return;
    }

    currentSelectionRange = range;

    highlightBtn.disabled = false;
  });

  highlightBtn.onclick = () => {

    if (!currentSelectionRange) return;

    const span = document.createElement("span");

    span.className = "highlight";

    const contents =
      currentSelectionRange.extractContents();

    span.appendChild(contents);

    currentSelectionRange.insertNode(span);

    createComment(span);

    window.getSelection().removeAllRanges();

    currentSelectionRange = null;

    highlightBtn.disabled = true;
  };
</script>
</body>
</html>
